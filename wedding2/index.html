<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <link rel="stylesheet" href="css/leaf.css" />

    <title></title>
  </head>
  <body>
    <!-- logo -->
    <header>
      <img
        class="logo"
        src="./images/static/logo.png"
        alt="Hồng Sơn & Minh Châu"
      />
    </header>
    <main>
      <!-- main 3 image -->
      <div class="block-main-image">
        <!-- background gray -->
        <div class="gray-block"></div>
        <div class="main-image">
          <div class="main-image__image" id="main-image__image1">
            <img
              src="./images/global/three-image-1.jpg"
              alt="Hồng Sơn & Minh Châu"
            />
            <div class="main-image__date">
              <p id="main-image__date1" class="transition">30</p>
            </div>
          </div>
          <div class="main-image__image" id="main-image__image2">
            <img
              src="./images/global/three-image-2.jpg"
              alt="Hồng Sơn & Minh Châu"
            />
            <div class="main-image__date"><p id="main-image__date2">10</p></div>
          </div>
          <div class="main-image__image" id="main-image__image3">
            <img
              src="./images/global/three-image-3.jpg"
              alt="Hồng Sơn & Minh Châu"
            />
            <div class="main-image__date">
              <p id="main-image__date3" class="transition">25</p>
            </div>
          </div>
        </div>
      </div>
      <!-- save the date -->
      <div>
        <!-- text save the date -->
        <div>
          <h2 class="headline" id="save-the-date">
            SAVE | <span style="font-size: 36px">THE</span> | DATE
          </h2>
        </div>
        <!-- image nhan -->
        <div class="headline" id="save-the-date__ring">
          <img src="./images/static/ring.png" alt="ring" />
        </div>
      </div>
      <!-- banner image -->
      <div class="headline" id="banner">
        <div id="banner__image">
          <img src="./images/global/banner.jpg" alt="banner" />
        </div>
        <div class="banner__text">
          <div id="banner-wedding" class="">
            <h3 class="headline">WEDDING<br /></h3>
          </div>
          <div id="banner-invitation" class="">
            <h3 class="headline">invitation<br /></h3>
          </div>
        </div>
      </div>
      <!-- name and name -->
      <div class="dflex">
        <div><img src="./images/static/name-left.png" alt="name-left" /></div>
        <div></div>
        <div></div>
        <div><img src="./images/static/name-left.png" alt="name-right" /></div>
      </div>
      <!-- wedding info -->
      <div></div>
      <!-- date time calendar -->
      <div></div>
      <!-- timeline -->
      <div></div>
      <!-- about us -->
      <div></div>
      <!-- road map -->
      <div></div>
      <!-- sweet memory -->
      <div></div>
      <!-- box  -->
      <div></div>
      <!-- form -->
      <div></div>
    </main>
    <!-- footer -->
    <footer></footer>

    <audio id="background-music" loop="">
      <source src="../audio/TaylorSwiftDaylight.mp3" />
    </audio>

    <!-- Nút toggle nhạc -->
    <div id="music-toggle" title="Bật / Tắt nhạc">
      <img id="play-icon" src="./images/static/music.png" alt="Play Icon" />
      <!-- <img
        id="pause-icon"
        src="../w.ladicdn.com/6801c7e1fbbd4d001283dac2/music_5927634-20250714103348-pjzeb.png"
        alt="Pause Icon"
        style="display: none"
      /> -->
    </div>
    <!-- <div class="leaves" id="leaves"></div> -->
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.4.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <!-- <script src="js/leaf.js"></script> -->
  </body>
</html>
